<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood &amp; Banners - Biome Sheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e8e8e8;
            line-height: 1.4;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border: 2px solid #d4af37;
            border-radius: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 2em;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 3px;
        }

        .biome-info {
            color: #b8860b;
            font-size: 0.95em;
            font-style: italic;
        }

        .biome-selector {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            padding: 8px 12px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #d4af37;
            border-radius: 5px;
            color: #d4af37;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.95em;
        }

        select:hover {
            background: rgba(212, 175, 55, 0.3);
        }

        .creatures-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .creature-card {
            background: linear-gradient(135deg, rgba(40,40,60,0.9), rgba(20,20,40,0.9));
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 10px;
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .creature-header {
            display: flex;
            flex-direction: row-reverse;
            gap: 10px;
            align-items: flex-start;
        }

        .creature-image {
            width: 70px;
            height: 90px;
            object-fit: cover;
            object-position: center;
            border: 1px solid #d4af37;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .creature-content {
            flex: 1;
            min-width: 0;
        }

        .creature-name {
            font-size: 1.1em;
            color: #ffd700;
            margin-bottom: 6px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            border-bottom: 1px solid #d4af37;
            padding-bottom: 3px;
        }

        .creature-tier {
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
        }

        .tier-common {
            background: rgba(100, 150, 100, 0.3);
            color: #7fb069;
            border: 1px solid #7fb069;
        }

        .tier-elite {
            background: rgba(100, 120, 200, 0.3);
            color: #6b7dd6;
            border: 1px solid #6b7dd6;
        }

        .tier-boss {
            background: rgba(200, 80, 80, 0.3);
            color: #d45555;
            border: 1px solid #d45555;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-flow: column;
            grid-template-rows: auto auto;
            gap: 2px 4px;
            margin-bottom: 6px;
        }

        .stat {
            display: contents;
        }

        .stat-label {
            color: #b8860b;
            font-size: 1em;
            font-weight: bold;
            margin: 0;
            text-align: center;
        }

        .stat-value {
            color: #ffd700;
            font-size: 0.9em;
            font-weight: bold;
            text-align: center;
        }

        .abilities {
            margin-top: 4px;
        }

        .ability {
            background: rgba(212,175,55,0.15);
            border-left: 1px solid #d4af37;
            padding: 4px 6px;
            margin: 3px 0;
            border-radius: 2px;
            font-size: 0.75em;
        }

        .ability-name {
            color: #ffd700;
            font-weight: bold;
            font-size: 0.8em;
            margin-bottom: 1px;
        }

        .ability-description {
            color: #e8e8e8;
            font-size: 0.7em;
            line-height: 1.2;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            background: #d4af37;
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }

        button:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .back-link {
            color: #ffd700;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #d4af37;
        }

        .error {
            background: rgba(212, 65, 65, 0.3);
            border: 2px solid #d44141;
            color: #ff9999;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2em;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .container {
                max-width: 100%;
                background: white;
                border: none;
                padding: 10px;
                box-shadow: none;
            }

            .controls {
                display: none;
            }

            .biome-selector {
                display: none;
            }

            .back-link {
                display: none;
            }

            .creatures-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            header {
                page-break-after: avoid;
                margin-bottom: 10px;
            }

            .creature-card {
                background: white;
                border: 1px solid #000;
                box-shadow: none;
                padding: 8px;
                gap: 8px;
            }

            .creature-image {
                width: 60px;
                height: 75px;
            }

            h1, .creature-name, .ability-name {
                color: #000;
            }

            .stat-label, .biome-info, .ability, .creature-tier {
                color: #333;
            }

            .stat-value {
                color: #000;
                font-weight: bold;
            }

            .tier-common, .tier-elite, .tier-boss {
                border-color: #333;
            }
        }

        @media (max-width: 768px) {
            .creatures-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 15px;
            }

            .biome-selector {
                flex-direction: column;
                align-items: stretch;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <a href="rulebook.html" class="back-link">← Back to Rulebook</a>
            <button onclick="window.print()">🖨️ Print Sheet</button>
        </div>

        <div class="biome-selector">
            <label for="biome-select" style="color: #d4af37; font-weight: bold;">Select Biome:</label>
            <select id="biome-select" onchange="displayBiomeSheet()">
                <option value="">Choose a biome...</option>
            </select>
        </div>

        <div id="content">
            <header>
                <h1 id="biomeTitle">Select a Biome</h1>
                <div class="biome-info" id="biomeInfo"></div>
            </header>

            <div class="creatures-grid" id="creaturesContainer">
                <div class="error">Select a biome to view creatures</div>
            </div>
        </div>
    </div>

    <script>
        let gameData = null;

        // Get biome name from URL parameter
        function getBiomeFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('biome');
        }

        // Load game data
        async function loadGameData() {
            try {
                const response = await fetch('data/gameData.json');
                gameData = await response.json();
                populateBiomeSelect();

                // If biome parameter is in URL, auto-load it
                const biomeFromURL = getBiomeFromURL();
                if (biomeFromURL) {
                    document.getElementById('biome-select').value = biomeFromURL;
                    displayBiomeSheet();
                }
            } catch (error) {
                console.error('Error loading game data:', error);
                showError('Error loading game data');
            }
        }

        // Populate the biome selector dropdown
        function populateBiomeSelect() {
            const select = document.getElementById('biome-select');
            gameData.monsters.forEach(biome => {
                const option = document.createElement('option');
                option.value = biome.biome;
                option.textContent = `${biome.biome} (${biome.color})`;
                select.appendChild(option);
            });
        }

        // Display the biome sheet
        function displayBiomeSheet() {
            const biomeName = document.getElementById('biome-select').value;

            if (!biomeName) {
                document.getElementById('biomeTitle').textContent = 'Select a Biome';
                document.getElementById('biomeInfo').textContent = '';
                document.getElementById('creaturesContainer').innerHTML =
                    '<div class="error">Select a biome to view creatures</div>';
                return;
            }

            const biome = gameData.monsters.find(b => b.biome === biomeName);

            if (!biome) {
                showError(`Biome "${biomeName}" not found.`);
                return;
            }

            // Update header
            document.getElementById('biomeTitle').textContent = biome.biome;
            document.getElementById('biomeInfo').textContent = `Color: ${biome.color}`;

            // Generate creature cards
            const creaturesContainer = document.getElementById('creaturesContainer');
            creaturesContainer.innerHTML = '';

            biome.creatures.forEach(creature => {
                const creatureCard = createCreatureCard(creature);
                creaturesContainer.appendChild(creatureCard);
            });

            // Update page title
            document.title = `${biome.biome} - Biome Sheet - Blood & Banners`;
        }

        // Create a creature card element
        function createCreatureCard(creature) {
            const card = document.createElement('div');
            card.className = 'creature-card';

            let abilitiesHTML = '';
            if (creature.abilities && creature.abilities.length > 0) {
                abilitiesHTML = '<div class="abilities">';
                creature.abilities.forEach(ability => {
                    abilitiesHTML += `
                        <div class="ability">
                            <div class="ability-name">${ability.name}</div>
                            <div class="ability-description">${ability.description}</div>
                        </div>
                    `;
                });
                abilitiesHTML += '</div>';
            }

            let imageHTML = '';
            if (creature.image) {
                imageHTML = `<img src="${creature.image}" alt="${creature.name}" class="creature-image">`;
            }

            const tierClass = creature.tier ? `tier-${creature.tier}` : '';
            const tierHTML = creature.tier ?
                `<div class="creature-tier ${tierClass}">${creature.tier}</div>` : '';

            card.innerHTML = `
                <div class="creature-header">
                    ${imageHTML}
                    <div class="creature-content">
                        <div class="creature-name">${creature.name}</div>
                        ${tierHTML}
                        <div class="stats-row">
                            <div class="stat">
                                <span class="stat-label">🏃</span>
                                <span class="stat-value">${creature.move}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">🏹</span>
                                <span class="stat-value">${creature.range}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">⚔️</span>
                                <span class="stat-value">${creature.power}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">🛡️</span>
                                <span class="stat-value">${creature.defense}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">❤️</span>
                                <span class="stat-value">${creature.hp}</span>
                            </div>
                        </div>
                    </div>
                </div>
                ${abilitiesHTML}
            `;

            return card;
        }

        // Show error message
        function showError(message) {
            document.getElementById('creaturesContainer').innerHTML =
                `<div class="error">${message}</div>`;
            document.getElementById('biomeTitle').textContent = 'Error';
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', loadGameData);
    </script>
</body>
</html>
